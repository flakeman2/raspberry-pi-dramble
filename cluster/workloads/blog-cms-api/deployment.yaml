apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-cms-api
  namespace: blog-cms
spec:
  progressDeadlineSeconds: 300
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: blog-cms-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: blog-cms-api
    spec:
      securityContext:
        runAsNonRoot: true
        # The distroless:nonroot image declares USER nonroot by name. Kubelet
        # cannot verify a non-numeric USER against runAsNonRoot, so pin the
        # matching UID/GID explicitly.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/flakeman2/blog-cms-api:sha-883299d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: blog-cms-api
          env:
            # Traefik pods run in the k3s pod network. Only those peers may
            # contribute X-Forwarded-For values used by the login rate limiter.
            - name: TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/16
          livenessProbe:
            httpGet:
              path: /post/api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /post/api/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
