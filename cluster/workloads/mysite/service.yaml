apiVersion: v1
kind: Service
metadata:
  name: mysite-nginx-service
  namespace: mysite-nginx
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  selector:
    app: mysite-nginx
  sessionAffinity: None
  type: ClusterIP
