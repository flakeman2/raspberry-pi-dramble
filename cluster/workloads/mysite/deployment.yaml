apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mysite-nginx
  name: mysite-nginx
  namespace: mysite-nginx
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mysite-nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mysite-nginx
    spec:
      containers:
      # Pinned from :latest on 2026-11-17 (action item 9). The running image's
      # index digest matched both `latest` and `1.31.8`, so this changes nothing
      # content-wise — it only stops `latest` from silently becoming 1.32 on a
      # node restart. curlimages/curl is pinned in the same style (7.81.0).
      - image: nginx:1.31.8
        imagePullPolicy: Always
        name: nginx
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: mysite-nginx-volume
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx-conf
          subPath: default.conf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mysite-nginx-volume
        persistentVolumeClaim:
          claimName: mysite-content
      - configMap:
          defaultMode: 420
          name: nginx-conf
        name: nginx-conf
