apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: pi-hole-service
  name: pi-hole-service
  namespace: pi-hole
spec:
  externalName: 192.168.0.46
  ports:
  - name: pi-hole-service
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik
  sessionAffinity: None
  type: ExternalName
