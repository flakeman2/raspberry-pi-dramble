# Dynamic DNS updater for the two domains served through Namecheap's
# Park-Your-Domain endpoint (dynamicdns.park-your-domain.com).
#
# Each CronJob reads its own key from the `dyn-dns-credentials` Secret
# (see cluster/secrets/examples/dyn-dns-credentials.yaml):
#
#   dyn-dns-devinflake.com  -> key password-devinflake.com
#   dyn-dns-flakeman2.com   -> key password-flakeman2.com
#
# Namecheap requires a UNIQUE DDNS password per domain, so one shared key
# cannot serve both (the single `password` key was retired 2026-11-16).
#
# Verify success by the response's <ErrCount>, never by job status: the API
# answers HTTP 200 with <ErrCount>1</ErrCount> for a wrong password, so the
# Job still reports Complete.
#
# `image` is pinned; keep it in step with cluster/dns/README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dyn-dns-devinflake.com
  namespace: default
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: dyn-dns
            image: curlimages/curl:7.81.0
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            env:
            - name: DDNS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dyn-dns-credentials
                  key: password-devinflake.com
            command:
            - /bin/sh
            - -c
            - |
              set -e
              for host in '@' 'www' '*'; do
                curl -fsS --retry 3 \
                  "https://dynamicdns.park-your-domain.com/update?host=${host}&domain=devinflake.com&password=${DDNS_PASSWORD}"
              done
---
