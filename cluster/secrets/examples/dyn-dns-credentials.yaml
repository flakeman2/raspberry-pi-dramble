# Dynamic DNS passwords for Namecheap's Park-Your-Domain service.
#
# Namecheap requires a UNIQUE password per domain, so this Secret carries one
# key per CronJob (see cluster/dns/cronjobs.yaml):
#
#   password-devinflake.com  -> dyn-dns-devinflake.com
#   password-flakeman2.com   -> dyn-dns-flakeman2.com
#
# Create it with both keys present; a CronJob whose key is missing sits in
# ContainerCreating. This file is an EXAMPLE — do not commit real passwords.
apiVersion: v1
kind: Secret
metadata:
  name: dyn-dns-credentials
  namespace: default
type: Opaque
stringData:
  password-devinflake.com: REPLACE_WITH_THE_DEVINFLAKE_COM_DDNS_PASSWORD
  password-flakeman2.com: REPLACE_WITH_THE_FLAKEMAN2_COM_DDNS_PASSWORD
