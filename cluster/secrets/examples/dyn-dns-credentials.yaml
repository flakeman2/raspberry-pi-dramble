# Dynamic DNS password for Park-Your-Domain.
#
# Shared by both CronJobs in cluster/dns/cronjobs.yaml. The current live
# CronJobs embed this value in the command line; after applying this Secret,
# re-apply the CronJobs to stop exposing it there.
#
# This file is an EXAMPLE. Do not commit a real password.
apiVersion: v1
kind: Secret
metadata:
  name: dyn-dns-credentials
  namespace: default
type: Opaque
stringData:
  password: REPLACE_WITH_THE_PARK_YOUR_DOMAIN_PASSWORD
