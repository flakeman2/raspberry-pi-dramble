# Grafana admin credentials.
#
# The Grafana Helm chart reads this Secret via:
#
#   admin:
#     existingSecret: grafana
#     userKey: admin-user
#     passwordKey: admin-password
#
# The live cluster's `grafana` Secret also contains an `ldap-toml` key added by
# the chart; it is empty because LDAP is disabled.
#
# This file is an EXAMPLE. Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_WITH_A_STRONG_PASSWORD
