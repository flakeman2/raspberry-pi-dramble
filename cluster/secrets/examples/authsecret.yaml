# HTTP basic-auth credentials for the Traefik and Longhorn dashboards.
#
# The value of `users` must be an htpasswd file body (one `user:hash` line per
# user). Generate it with:
#
#   htpasswd -nbB admin 'choose-a-password'
#
# then paste the output (without quotes) below, or create the Secret directly:
#
#   kubectl -n default create secret generic authsecret \
#     --from-literal=users="$(htpasswd -nbB admin 'choose-a-password')"
#
# This file is an EXAMPLE. Do not commit a real hash.
apiVersion: v1
kind: Secret
metadata:
  name: authsecret
  namespace: default
type: Opaque
stringData:
  users: "admin:$2y$05$REPLACE_WITH_A_REAL_BCRYPT_HASH"
