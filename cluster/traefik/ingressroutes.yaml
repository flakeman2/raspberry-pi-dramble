apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dflake-dashboard
  namespace: traefik
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`traefik.devinflake.com`, `traefik.flakeman2.com`)
    middlewares:
    - name: basic-auth
      namespace: default
    - name: redirect-to-https
      namespace: default
    services:
    - kind: TraefikService
      name: api@internal
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-ingress
  namespace: whoami
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`devinflake.com`, `www.devinflake.com`, `flakeman2.com`, `www.flakeman2.com`)
      && PathPrefix(`/whoami`)
    middlewares:
    - name: redirect-to-https
      namespace: default
    services:
    - name: whoami
      port: 80
  tls:
    certResolver: letsencrypt
---
