# Traefik values for chart `traefik` 42.4.0 (app v3.7.18).
#
#   helm upgrade --install traefik traefik/traefik \
#     --namespace traefik --version 42.4.0 \
#     -f cluster/traefik/values.yaml
#
# The chart's values schema sets `additionalProperties: false` at the top
# level: every key below must exist in chart 42, so do not copy keys from an
# older chart version. `image` is omitted — the chart pins its own appVersion.
#
# The LoadBalancer Service is pinned to 192.168.0.201 (the MetalLB pool is
# .201-.250) so public DNS keeps pointing at a known address; MetalLB 0.16
# still honours the `metallb.universe.tf/loadBalancerIPs` annotation.
# Certificates are issued by Traefik's built-in ACME (TLS-ALPN challenge) and
# stored in /data/acme.json on the `traefik` Longhorn PVC.

deployment:
  replicas: 1
  initContainers:
  - name: volume-permissions
    image: busybox:1.37.0
    # Chart 42 sets a pod-level securityContext of runAsUser/runAsGroup 65532
    # with runAsNonRoot, which the init container would otherwise inherit. It
    # must run as root to prepare the Longhorn volume (root:root, drwxr-xr-x),
    # otherwise `touch /data/acme.json` fails with "Permission denied" and the
    # pod loops in Init:Error. Container-level settings override the pod-level
    # ones, so pin uid 0 explicitly.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    command:
    - sh
    - -c
    - chown 65532:65532 /data && chmod 750 /data && touch /data/acme.json && chown 65532:65532 /data/acme.json && chmod 600 /data/acme.json
    volumeMounts:
    - name: data
      mountPath: /data

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 128Mi

service:
  spec:
    type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.0.201"

ingressRoute:
  dashboard:
    enabled: true

additionalArguments:
- "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
- "--certificatesresolvers.letsencrypt.acme.email=devinflake@gmail.com"
- "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
- "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory"

providers:
  kubernetesCRD:
    allowCrossNamespace: true

log:
  level: ERROR

accessLog:
  enabled: true
  fields:
    headers:
      defaultMode: drop

metrics:
  prometheus:
    entryPoint: metrics

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
