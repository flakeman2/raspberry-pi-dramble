# Prometheus values for chart `prometheus-community/prometheus` 29.47.2
# (Prometheus 3.16.0).
#
#   helm upgrade --install prometheus prometheus-community/prometheus \
#     --namespace monitoring --version 29.47.2 \
#     -f cluster/monitoring/prometheus-values.yaml
#
# Everything else stays at chart defaults: server PVC 8 GiB on Longhorn,
# Alertmanager with a 2 GiB PVC, plus kube-state-metrics, node-exporter and
# pushgateway.
#
# Retention decision (2026-11-21): 15 days is enough and stays explicit below.
# Measured TSDB blocks were ~1.8 GiB with ~99k head series on the 8 GiB PVC —
# roughly a quarter of the volume, leaving headroom for compaction. Revisit if
# blocks exceed 4 GiB; the next lever is `server.retentionSize: 6Gi`.
#
# The chart leaves `server.resources` empty by default, and the server is the
# largest memory consumer on a 4 GB node — hence the explicit budget below.

server:
  retention: "15d"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # Memory only: a CPU limit on Prometheus can throttle ingestion during
      # scrape spikes (see docs/action-items.md item 6). Add one after
      # measuring, if at all.
      memory: 1Gi

# Alert rules are rendered into the prometheus-server ConfigMap by the chart
# and reloaded by configmap-reload. Every expression below was checked against
# live metrics before it was committed; Longhorn series only appear once PR
# #66's `longhorn-metrics` scrape is live.
#
# Certificate-expiry alerts are deliberately absent: Traefik keeps its ACME
# certificate in a file on its PVC, not in a Kubernetes Secret, so there is no
# `cert-manager_certificate_expiration_timestamp_seconds` series to alert on.
serverFiles:
  alerting_rules.yml:
    groups:
    - name: dramble.rules
      rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is NotReady"
          description: "kubelet on {{ $labels.node }} has not reported Ready for 5 minutes."

      - alert: PersistentVolumeClaimNotBound
        expr: kube_persistentvolumeclaim_status_phase{phase="Bound"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is not Bound"
          description: "The PVC has not reached Bound for 15 minutes; check the provisioner and Longhorn."

      # longhorn_volume_robustness has one series per state per volume, with
      # value 1 only for the current state, so no `> 0` is needed.
      - alert: LonghornVolumeDegraded
        expr: longhorn_volume_robustness{state="degraded"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Longhorn volume {{ $labels.volume }} is degraded"
          description: "A replica of {{ $labels.volume }} is unavailable; rebuild is in progress or stalled."

      - alert: LonghornVolumeFaulted
        expr: longhorn_volume_robustness{state="faulted"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Longhorn volume {{ $labels.volume }} is faulted"
          description: "{{ $labels.volume }} has no healthy replica; workloads using it are at risk."

      # The second branch covers a CronJob that has run but never succeeded:
      # kube-state-metrics omits last_successful_time in that case, so a plain
      # `>` comparison would silently produce no alert.
      - alert: CronJobFailed
        expr: |
          (
            max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time)
            >
            max by (namespace, cronjob) (kube_cronjob_status_last_successful_time)
          )
          or
          (
            max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time)
            unless
            max by (namespace, cronjob) (kube_cronjob_status_last_successful_time)
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded"
          description: "Its last scheduled run has no later successful run; inspect the Job pods."

configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Subchart budgets. Keys are the dependency names, not aliases; probes come
# from each subchart's defaults. In addition to the resource budget, this block
# routes alerts to ntfy.sh and mounts the URL from a SealedSecret: Alertmanager
# cannot expand ${ENV} in its config, so `url_file` is the only way to keep the
# topic out of git while still using a webhook receiver.
alertmanager:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  configmapReload:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ntfy
    receivers:
    - name: ntfy
      webhook_configs:
      - url_file: /etc/alertmanager/ntfy/url
        send_resolved: true
  extraVolumes:
  - name: ntfy-url
    secret:
      secretName: alertmanager-ntfy
      defaultMode: 0444
      items:
      - key: url
        path: url
  extraVolumeMounts:
  - name: ntfy-url
    mountPath: /etc/alertmanager/ntfy
    readOnly: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheus-pushgateway:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# MetalLB metrics. Since v0.16 these are HTTPS on 9120 with bearer-token auth,
# so the chart's annotation-driven `kubernetes-pods` job cannot scrape them: it
# would use plain HTTP and send no Authorization header. MetalLB's pod
# annotations were removed from the vendored manifest for that reason, and the
# pods are discovered by label here instead.
#
# Requires cluster/metallb/metrics-rbac.yaml (TokenReview/SAR for MetalLB,
# `get` on /metrics for the Prometheus ServiceAccount) — both applied by
# scripts/install-addons.sh.
#
# Longhorn metrics: longhorn-manager exposes Prometheus text at
# http://longhorn-backend:9500/metrics, but its own NetworkPolicy denies
# ingress from outside longhorn-system. cluster/monitoring/manifests/ adds the
# narrow allow rule, owned by this Application so the scrape and its exception
# land together. Without both, the Longhorn dashboard is empty.
scrapeConfigs:
  metallb-metrics:
    enabled: true
    job_name: metallb-metrics
    kubernetes_sd_configs:
    - role: pod
    scheme: https
    tls_config:
      insecure_skip_verify: true   # MetalLB auto-generates a self-signed cert
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
    # role: pod emits one target per declared container port — keep only the
    # metrics port (the controller also declares webhook 9443, which 404s).
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      action: keep
      regex: "9120"
    # Prometheus relabel fields are snake_case (source_labels/target_label),
    # unlike Kubernetes CRD fields — camelCase is rejected as
    # "field sourceLabels not found in type relabel.plain".
    - source_labels: [__meta_kubernetes_namespace]
      action: keep
      regex: metallb-system
    - source_labels: [__meta_kubernetes_pod_label_component]
      action: keep
      regex: controller|speaker
    - source_labels: [__meta_kubernetes_pod_name]
      target_label: pod
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: instance

  longhorn-metrics:
    enabled: true
    job_name: longhorn-metrics
    metrics_path: /metrics
    static_configs:
    - targets:
      - longhorn-backend.longhorn-system.svc.cluster.local:9500
