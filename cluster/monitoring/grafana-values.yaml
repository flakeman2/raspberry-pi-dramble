# Grafana values for chart `grafana` 14.5.0 (app 13.3.1).
#
# The chart moved to the grafana-community repository after 2026-01-30; the
# old grafana.github.io endpoint still serves it but is frozen at the
# deprecated 10.5.x line.
#
#   kubectl -n monitoring create secret generic grafana \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='...'
#
#   helm upgrade --install grafana grafana/grafana \
#     --namespace monitoring --version 14.5.0 \
#     -f cluster/monitoring/grafana-values.yaml
#
# `image.tag` is omitted so the chart pins its own appVersion (13.3.1).
# `persistence.storageClassName` is honoured by the chart's PVC template even
# though it is not listed in the chart's default values.
#
# The Prometheus datasource is codified here because on the live cluster it was
# added through the UI and is not present in the stored Helm values. Its UID is
# fixed so the git-provisioned dashboards can reference it without templating.
#
# Dashboards themselves live in `dashboards/` as JSON and are delivered by
# Kustomize ConfigMaps carrying `grafana_dashboard: "1"`. The chart's sidecar
# watches that label and re-provisions them on every change, so nothing in the
# ReadWriteOnce PVC is irreplaceable (action item 10).

image:
  repository: grafana/grafana

replicas: 1

# The PVC below is ReadWriteOnce, and the chart's default strategy is
# RollingUpdate with maxSurge/maxUnavailable of 25% — against a single replica
# that rounds to maxSurge 1 / maxUnavailable 0, so the new pod is created
# *first* and the old one is not terminated until the new one is Available.
# The new pod cannot attach the volume the old pod still holds, and the old pod
# will not release it: a deadlock. Hit for real during the 2026-11-17 unified
# password rotation (the rollout hung on "1 old replicas are pending
# termination" and needed a manual scale 0 → 1). Same class of bug as Traefik's
# RWO `acme.json` (cluster-status.md defect 5, PR #22).
#
# `Recreate` trades a few seconds of downtime on upgrade for a rollout that
# always completes — the right call for one replica with no HA to protect.
deploymentStrategy:
  type: Recreate

persistence:
  enabled: true
  type: pvc
  storageClassName: longhorn
  size: 10Gi

service:
  type: ClusterIP
  port: 80

grafana.ini:
  server:
    # Links, share URLs and OAuth redirects must use the public HTTPS name,
    # not the ClusterIP the IngressRoute proxies to.
    root_url: https://grafana.devinflake.com
  auth.anonymous:
    # Explicit rather than relying on the chart's default: the UI is behind
    # Grafana's own login at the public hostname.
    enabled: false

# The dashboard sidecar is off by default in this chart. It watches labelled
# ConfigMaps in the monitoring namespace and writes the dashboards into the
# Grafana database on every change, which is what makes git the source of
# truth. Keep a small budget: item 6 is about unbudgeted containers.
sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  dashboards:
    enabled: true
    resource: configmap
    defaultFolderName: Dramble

# Probes come from the chart's defaults (GET /api/health).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

adminUser: admin
admin:
  existingSecret: grafana
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    # Grafana 13 cannot change the UID of an existing datasource. The one in
    # the PVC was created through the UI with a generated UID, so pinning
    # `prometheus` below makes provisioning fail at startup with "Datasource
    # provisioning error: data source not found". Delete by name first, then
    # recreate it with the stable UID the git-authored dashboards reference.
    deleteDatasources:
    - name: Prometheus
      orgId: 1
    datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-server
      isDefault: true
      jsonData:
        httpMethod: POST
        manageAlerts: true
