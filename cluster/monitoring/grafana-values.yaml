# Grafana values for chart `grafana` 14.4.1 (app 13.3.1).
#
# The chart moved to the grafana-community repository after 2026-01-30; the
# old grafana.github.io endpoint still serves it but is frozen at the
# deprecated 10.5.x line.
#
#   kubectl -n monitoring create secret generic grafana \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='...'
#
#   helm upgrade --install grafana grafana/grafana \
#     --namespace monitoring --version 14.4.1 \
#     -f cluster/monitoring/grafana-values.yaml
#
# `image.tag` is omitted so the chart pins its own appVersion (13.3.1).
# `persistence.storageClassName` is honoured by the chart's PVC template even
# though it is not listed in the chart's default values.
#
# The Prometheus datasource is codified here because on the live cluster it was
# added through the UI and is not present in the stored Helm values.

image:
  repository: grafana/grafana

replicas: 1

persistence:
  enabled: true
  type: pvc
  storageClassName: longhorn
  size: 10Gi

service:
  type: ClusterIP
  port: 80

# Probes come from the chart's defaults (GET /api/health).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

adminUser: admin
admin:
  existingSecret: grafana
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-server
      isDefault: true
      jsonData:
        httpMethod: POST
        manageAlerts: true
