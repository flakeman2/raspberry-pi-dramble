apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-dashboard
  namespace: longhorn-system
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`longhorn.devinflake.com`) || Host(`longhorn.flakeman2.com`)
    middlewares:
    - name: basic-auth
      namespace: default
    - name: redirect-to-https
      namespace: default
    services:
    - name: longhorn-frontend
      port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-dashboard
  namespace: monitoring
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`grafana.devinflake.com`) || Host(`grafana.flakeman2.com`)
    middlewares:
    # Without this, port 80 had no route for these hosts and returned 404
    # while the longhorn and prometheus UIs redirected correctly.
    - name: redirect-to-https
      namespace: default
    services:
    - name: grafana
      port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-dashboard
  namespace: monitoring
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`prometheus.devinflake.com`) || Host(`prometheus.flakeman2.com`)
    middlewares:
    - name: basic-auth
      namespace: default
    - name: redirect-to-https
      namespace: default
    services:
    - name: prometheus-server
      port: 80
  tls:
    certResolver: letsencrypt
