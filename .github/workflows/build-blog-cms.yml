name: Build blog CMS API image

on:
  push:
    branches: [dev]
    paths:
      - 'services/blog-cms-api/**'
      - '.github/workflows/build-blog-cms.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blog-cms-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/blog-cms-api/go.mod
          cache-dependency-path: services/blog-cms-api/go.sum

      - name: Test and vet
        working-directory: services/blog-cms-api
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: image
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=7 HEAD)
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "full=ghcr.io/flakeman2/blog-cms-api:sha-${short}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/blog-cms-api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.full }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --silent -X PATCH /user/packages/container/blog-cms-api -f visibility=public

      - name: Summarize
        env:
          IMAGE: ${{ steps.image.outputs.full }}
        run: |
          {
            echo '### blog-cms-api'
            echo
            printf '\x60%s\x60\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
