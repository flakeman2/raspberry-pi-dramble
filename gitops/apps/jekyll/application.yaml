apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jekyll-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/flakeman2/raspberry-pi-dramble.git
    targetRevision: dev
    # See gitops/apps/mysite-nginx/application.yaml for why the path stays
    # under cluster/ instead of moving here.
    path: cluster/workloads/jekyll
  destination:
    server: https://kubernetes.default.svc
    namespace: jekyll
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
