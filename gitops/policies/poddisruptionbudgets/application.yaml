apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poddisruptionbudgets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/flakeman2/raspberry-pi-dramble.git
    targetRevision: dev
    # Eight first-party PDBs; each document names its own namespace, so
    # destination.namespace is only Argo CD's fallback.
    path: cluster/poddisruptionbudgets
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
