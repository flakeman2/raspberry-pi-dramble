apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networkpolicies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/flakeman2/raspberry-pi-dramble.git
    targetRevision: dev
    # Ingress allow-lists for monitoring/mysite-nginx/jekyll/whoami plus the
    # DynDNS CronJobs' egress allow-list. Each manifest names its own namespace;
    # destination.namespace is only Argo CD's fallback.
    path: cluster/networkpolicies
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
