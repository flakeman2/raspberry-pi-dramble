apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
  annotations:
    # After the controller itself (wave 0): routes and middlewares are
    # meaningless until Traefik is serving.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: dramble
  source:
    repoURL: https://github.com/flakeman2/raspberry-pi-dramble.git
    targetRevision: dev
    # Built by cluster/traefik/kustomization.yaml, which lists only the three
    # CR files — the directory also holds values.yaml, which is not a manifest
    # and would break a plain path-based Application.
    path: cluster/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  # Registered MANUAL first, per the phase-2 discipline: sync disabled, diff
  # read line by line, and only then automation. The diff was empty apart
  # from Argo's tracking-id on all 12 CRs, so automation follows.
  #
  # Split from `traefik` because an Application is either a Helm chart or a
  # directory of manifests, never both: this one owns the routes, middlewares
  # and TLS options, the other owns the release.
  #
  # prune is safe here: `argocd app resources traefik-config` lists exactly
  # the 12 objects that cluster/traefik/kustomization.yaml builds — six
  # IngressRoutes, five Middlewares, one TLSOption — and nothing else. There
  # is no controller-generated object for a prune to reach.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
